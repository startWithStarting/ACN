[project]
name = "acn"
version = "0.1.0"
description = "Agent Communication Networks (ACN) - Multi-agent systems with onboard sensing and actuation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "pettingzoo>=1.24.3",
    "gymnasium>=0.29.0",
    "numpy>=1.21",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.0.0",
    "scikit-learn>=1.4.0",
    "imageio>=2.0.0",
    "torch>=2.0.0",
    "torch-geometric>=2.5.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "pygame>=2.5.0",
    "stable-baselines3>=2.3.0",
    "supersuit>=3.9.0",
    "tensorboard>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
