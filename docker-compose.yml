services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: acn
      POSTGRES_USER: acn
      POSTGRES_PASSWORD: acn
    ports:
      - "5432:5432"
    volumes:
      - acn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acn -d acn"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ACN_DATABASE_URL: postgresql://acn:acn@postgres:5432/acn
      ACN_ARTIFACT_DIR: /app/results/api_artifacts
      MPLBACKEND: Agg
      SDL_VIDEODRIVER: dummy
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  acn_postgres_data:
