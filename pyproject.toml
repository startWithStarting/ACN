[project]
name = "acn"
version = "0.1.0"
description = "Agent Communication Networks (ACN) - Multi-agent systems with onboard sensing and actuation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "pettingzoo>=1.24.3",
    "gymnasium>=0.29.0",
    "numpy>=1.21",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.0.0",
    "scikit-learn>=1.4.0",
    "imageio>=2.0.0",
    "torch>=2.0.0",
    "torch-geometric>=2.5.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "pygame>=2.5.0",
    "stable-baselines3>=2.3.0",
    "supersuit>=3.9.0",
    "tensorboard>=2.15.0",
    "loguru>=0.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "torchrl>=0.10.1",
    "tensordict>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
# Entry points deliberately run load_dotenv()/warnings setup before imports.
"main.py" = ["E402"]
"main_parallel.py" = ["E402"]
"run.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_implicit_optional = false
warn_unused_ignores = true
exclude = [
    "^docs/_build/",
    "^logs/",
    "^results/",
]

[dependency-groups]
dev = [
    "codespell>=2.4.2",
    "detect-secrets>=1.5.0",
    "mdformat>=0.7.22",
    "mdformat-black>=0.1.1",
    "mdformat-gfm>=0.4.1",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pyupgrade>=3.21.0",
    "ruff>=0.15.12",
]
