# Avoidant Strategy Configuration

experiment_name: "avoidant_strategy_scaled"
results_base_dir: "results" # Base directory to store experiment results

agents:
  blue_agents:
    - count: 30
      communication_bandwidth: 15 # Max agents it can talk to per step
      processing_capability: 30  # Max past time steps it can use for prediction
      detection_radius: 50.0     # Radius within which the agent can detect Red agents
      strategy_type: "pursuit"  # Move toward predicted positions of red agents
      prediction_interval: 1   # Update predictions every 1 step
      prediction_timeout: 4     # Stop predicting if agent unseen for > 4 steps
      observation_window_size: 5 # Number of past steps to use for prediction

  red_agents:
    - count: 30  # All red agents use avoidant strategy
      communication_bandwidth: 5
      processing_capability: 3
      detection_radius: 20.0
      strategy_type: "avoidant"  # Detect and avoid blue agents

environment:
  # Environment-specific parameters will go here
  width: 300  # Width (W) of the Cartesian grid
  height: 300  # Height (H) of the Cartesian grid
  render_mode: "human_pygame" # Use PyGame rendering for performance
  save_episode_gifs: True
  max_cycles: 150 # Max cycles for the simulation loop in main.py
  debug_mode: False # Enable verbose logging and JSON position recording

analysis:
  trace:
    enabled: true
  plots:
    generate_after_run: false

training:
  # Training-specific parameters
  # For example: learning_rate, batch_size, num_episodes, algorithm, etc.
  algorithm: "PPO" # Example
  num_episodes: 1
  learning_rate: 0.0003
