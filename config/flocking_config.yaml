# Configuration file for testing the flocking strategy
# In this configuration, red agents use the flocking strategy
# Flocking behavior includes cohesion, alignment, and separation

dimensions:
  width: 100
  height: 80

agents:
  # blue_agents:
  #   - count: 2
  #     communication_bandwidth: 15 # Max agents it can talk to per step
  #     processing_capability: 5   # Max past time steps it can use for prediction
  #     detection_radius: 20.0     # Radius within which the agent can detect Red agents
  #     strategy_type: "pursuit"  # Move toward predicted positions of red agents
  #   - count: 2
  #     communication_bandwidth: 5
  #     processing_capability: 2
  #     detection_radius: 15.0     # Different detection radius for this group
  #     strategy_type: "static"   # Stay stationary

  red_agents:
    - count: 16  # All red agents use flocking strategy
      communication_bandwidth: 5
      processing_capability: 3
      detection_radius: 100.0
      strategy_type: "flocking"  # New flocking strategy
      # Flocking-specific parameters
      cohesion_weight: 500    # Weight for cohesion (moving toward group center)
      alignment_weight: 1   # Weight for alignment (moving in the same direction as others)
      separation_weight: 1  # Weight for separation (avoiding crowding)
      separation_radius: .5   # Distance threshold for separation behavior

environment:
  # Environment-specific parameters will go here
  width: 100  # Width (W) of the Cartesian grid
  height: 80  # Height (H) of the Cartesian grid
  render_mode: "human_matplotlib_pred" # Enable rendering with predictions
  save_episode_gifs: True
  max_cycles: 50  # Increase the number of cycles to observe more complex behaviors
